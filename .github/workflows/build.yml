# Genera los instaladores de Windows (.exe) y Android (.apk) y los publica en "Releases"
name: Generar instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android (tableta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Compilar la interfaz
        run: npm run build
      - name: Copiar a Android
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.APP_VERSION }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "Organizador-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Organizador-*.apk

  windows:
    name: Windows (PC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - run: npm version "${{ env.APP_VERSION }}" --no-git-tag-version --allow-same-version
      - name: Crear instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  publicar:
    name: Publicar descarga
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Organizador ${{ env.APP_VERSION }}
          make_latest: true
          files: out/*
          body: |
            **Para el PC (Windows):** descarga `Organizador-Setup-${{ env.APP_VERSION }}.exe` y ábrelo.
            **Para la tableta (Android):** descarga `Organizador-${{ env.APP_VERSION }}.apk` en la tableta y ábrelo.

            Al instalar una versión nueva encima de la anterior, tus datos se conservan.
